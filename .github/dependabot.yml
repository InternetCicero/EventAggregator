version: 2
updates:
  - package-ecosystem: npm
    directories: [/server, /client, /e2e]
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      npm-minor-und-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
