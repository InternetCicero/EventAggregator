name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  server-tests:
    name: Backend-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm run lint
        working-directory: server
      - run: npm test
        working-directory: server
      # Nur eine Warnung: bekannte Schwachstellen sollen auffallen, aber nicht jeden Push blockieren
      - run: npm audit --audit-level=high
        working-directory: server
        continue-on-error: true

  client-build:
    name: Frontend-Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm test
        working-directory: client
      - run: npm run build
        working-directory: client
      - run: npm run lint
        working-directory: client
      - run: npm audit --audit-level=high
        working-directory: client
        continue-on-error: true

  ui-tests:
    name: UI-Tests (Browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
            e2e/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: client
      - run: npm ci
        working-directory: e2e
      - name: Playwright-Browser-Cache
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
        if: steps.pw-cache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        working-directory: e2e
        if: steps.pw-cache.outputs.cache-hit == 'true'
      - run: npx playwright test
        working-directory: e2e
      - name: Screenshots und Trace bei Fehlschlag sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-ergebnisse
          path: |
            e2e/test-results
            e2e/playwright-report
          retention-days: 7
