name: Deploy

# Rollt erst aus, wenn der CI-Lauf für den Push auf main erfolgreich war.
# Manuell (workflow_dispatch) geht es weiterhin ohne CI-Bedingung, z. B. für ein erneutes Ausrollen.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Nie zwei Deployments gleichzeitig
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Auf VM ausrollen
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    steps:
      - name: Hinweis zum manuellen Start
        if: github.event_name == 'workflow_dispatch'
        run: echo "::notice::Manuelles Deploy, ohne Prüfung des CI-Laufs."

      - name: SSH-Schlüssel einrichten
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: update.sh auf der VM ausführen
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$VM_USER@$VM_HOST" \
            'sudo bash /opt/eventaggregator/deploy/update.sh'

      - name: Live-Seite prüfen
        run: |
          for url in https://student.laurenz-polanski.de/api/health https://student.laurenz-polanski.de/; do
            curl --fail --silent --show-error --output /dev/null \
              --retry 5 --retry-delay 5 --retry-all-errors "$url"
            echo "OK: $url"
          done
