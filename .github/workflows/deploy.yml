name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nie zwei Deployments gleichzeitig
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-check:
    name: Frontend-Build prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run build
        working-directory: client

  deploy:
    name: Auf VM ausrollen
    needs: build-check
    runs-on: ubuntu-latest
    steps:
      - name: SSH-Schlüssel einrichten
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: update.sh auf der VM ausführen
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$VM_USER@$VM_HOST" \
            'sudo bash /opt/eventaggregator/deploy/update.sh'
