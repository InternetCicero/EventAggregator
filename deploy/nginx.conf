# /etc/nginx/sites-available/eventaggregator
# Ersetze DEINE-DOMAIN-ODER-IP unten. Ohne eigene Domain kannst du die
# externe IP der VM eintragen (dann funktioniert kein TLS/certbot, nur HTTP).

server {
    listen 80;
    listen [::]:80;
    server_name DEINE-DOMAIN-ODER-IP;

    # React-Build (Single Page App)
    root /opt/eventaggregator/client/dist;
    index index.html;

    # Hochgeladene Screenshots u.ä. können größer sein als das Standardlimit
    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # OCR-Requests können ein paar Sekunden dauern
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri /index.html;
    }
}
